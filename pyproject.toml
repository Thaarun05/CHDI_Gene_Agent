[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gene-dossier"
version = "0.1.0"
description = "Provenance-first Gene Dossier Platform for Huntington's disease research (CHDI-style gene dossiers)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Gene Dossier Platform" }]
keywords = ["bioinformatics", "provenance", "huntington", "gene-dossier", "chdi"]

dependencies = [
    # Core backend / data
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlmodel>=0.0.16",
    # Postgres driver for Supabase / DATABASE_URL=postgresql+psycopg://...
    # SQLite remains available for local/offline tests without this being used.
    "psycopg[binary]>=3.1",
    "httpx>=0.27",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "beautifulsoup4>=4.12",
    "Pillow>=10.0",
    "openpyxl>=3.1",
    "matplotlib>=3.8",
    "playwright>=1.45",
    # Workflow orchestration (LangGraph) + LLM/RAG abstraction (LangChain).
    # Packages are required; OpenAI/Anthropic *API keys* are optional — retrieval and
    # normalization still run without keys; synthesis falls back to deterministic markdown.
    "langchain>=0.3",
    "langgraph>=0.2",
    "langchain-openai>=0.2",
    "langchain-anthropic>=0.2",
    "langchain-community>=0.3",
    # MVP vector index over EvidenceRecord display text (NOT the source of truth).
    "chromadb>=0.5",
]

[project.optional-dependencies]
# MVP UI (deferred).
ui = [
    "streamlit>=1.33",
]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "respx>=0.21",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gene_dossier"]

[tool.hatch.build.targets.wheel.force-include]
"src/gene_dossier/assets" = "gene_dossier/assets"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]
